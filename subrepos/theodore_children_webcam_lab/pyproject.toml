[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "theodore-children-webcam-lab"
version = "0.49.0"
description = "Private, playful webcam learning and movement games for children ages 4-10."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<0.116",
  "pydantic>=2.7,<3",
  "uvicorn[standard]>=0.30,<0.35",
]

[project.optional-dependencies]
test = ["pytest>=8.2,<9", "httpx>=0.27,<0.28"]

[project.scripts]
theodore-children-webcam-lab = "theodore_children_webcam_lab.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
theodore_children_webcam_lab = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
