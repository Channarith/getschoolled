[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "theodore-music-lab"
version = "0.1.0"
description = "Private lab: learn-through-music line-by-line sessions with 100+ original songs and 26+ language meanings."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<0.116",
  "pydantic>=2.7,<3",
  "uvicorn[standard]>=0.30,<0.35",
]

[project.optional-dependencies]
test = ["pytest>=8.2,<9", "httpx>=0.27,<0.28"]
# Server-rendered neural voices for all 27 translation languages. Without it the
# player falls back to whatever voices the listener's OS installed.
# 6.1.12 and earlier get 403 from Microsoft's speech WebSocket (missing
# Sec-MS-GEC). 7.2.8 is the current release that still works.
voices = ["edge-tts==7.2.8"]
# Word-level speech recognition for scripts/align_songs.py. Offline authoring
# only: the committed data/alignment.jsonl is what the running app reads, so
# nobody needs this to serve or test the lab.
#
# faster-whisper 1.0.3 imports `requests` but never declares it: it used to
# arrive with huggingface-hub, which has since dropped it for httpx. Installing
# the extra alone therefore crashed align_songs.py with ModuleNotFoundError, so
# pin it here.
asr = ["faster-whisper==1.0.3", "requests>=2.31,<3"]

[project.scripts]
theodore-music-lab = "theodore_music_lab.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
