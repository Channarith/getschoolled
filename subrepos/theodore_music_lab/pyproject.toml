[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "theodore-music-lab"
version = "0.1.0"
description = "Private lab: learn-through-music line-by-line sessions with 100+ original songs and 26+ language meanings."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<0.116",
  "pydantic>=2.7,<3",
  "uvicorn[standard]>=0.30,<0.35",
]

[project.optional-dependencies]
test = ["pytest>=8.2,<9", "httpx>=0.27,<0.28"]
# Server-rendered neural voices for all 27 translation languages. Without it the
# player falls back to whatever voices the listener's OS installed.
voices = ["edge-tts==6.1.12"]

[project.scripts]
theodore-music-lab = "theodore_music_lab.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
