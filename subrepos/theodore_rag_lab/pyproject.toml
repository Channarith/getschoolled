[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "theodore-rag-lab"
version = "0.1.0"
description = "Private lab: RAG auto-tune, dictionary corpus, read-aloud, and multi-language voice training."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<0.116",
  "pydantic>=2.7,<3",
  "uvicorn[standard]>=0.30,<0.35",
]

[project.optional-dependencies]
test = ["pytest>=8.2,<9", "httpx>=0.27,<0.28"]

[project.scripts]
theodore-rag-lab = "theodore_rag_lab.main:main"
theodore-rag-train = "theodore_rag_lab.bakeoff_loop:cli_main"
theodore-rag-corpus-update = "theodore_rag_lab.cli_corpus:corpus_update_main"
theodore-rag-read-aloud = "theodore_rag_lab.cli_corpus:read_aloud_main"
theodore-rag-voice-queue = "theodore_rag_lab.cli_voice:main"
theodore-rag-drop = "theodore_rag_lab.cli_drop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
