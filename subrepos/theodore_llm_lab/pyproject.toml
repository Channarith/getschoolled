[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "theodore-llm-lab"
version = "0.1.0"
description = "Private lab: assemble library/profile/webcam/audio/game/RAG signals into a portable education LLM for humanoid robots."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<0.116",
  "pydantic>=2.7,<3",
  "uvicorn[standard]>=0.30,<0.35",
]

[project.optional-dependencies]
test = ["pytest>=8.2,<9", "httpx>=0.27,<0.28"]

[project.scripts]
theodore-llm-lab = "theodore_llm_lab.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
theodore_llm_lab = ["fixtures/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
