[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aoep-vision-agent"
version = "0.1.0"
description = "Webcam presence, silhouette detection, and xAI Grok voice-agent service for solo and group teaching sessions."
requires-python = ">=3.11"
dependencies = [
  "aoep-shared",
  "fastapi>=0.111,<0.116",
  "uvicorn[standard]>=0.30,<0.35",
  "python-multipart==0.0.32",
  # Self-hosted silhouette detection (MOG2 background subtraction).
  "opencv-contrib-python-headless==4.10.0.84",
  "numpy==1.26.4",
]

[project.optional-dependencies]
test = ["pytest>=8.2,<9", "httpx>=0.27,<0.28"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
