# TTS bake-off candidate matrix: license, language coverage and hardware, from primary sources.
#
# Rules (enforced by tts_bakeoff/schema.py and its tests):
#   - Every license/coverage claim carries evidence: a URL, a short quote and a retrieval date.
#   - commercial_ok is "yes", "no" or "unverified" (always quoted; bare yes/no would parse as booleans).
#     Anything not read from a primary source stays "unverified", which counts as NOT shippable.
#   - shippable = code yes AND weights yes AND training_data is not "no".
#   - role "product" is allowed only for shippable candidates; "candidate" means promising but a shippability check is still open. Non-shippable open models are
#     "reference" (run internally as baselines, clearly labelled not shippable) or "excluded".
#   - Cloud services have role "ceiling": a quality yardstick and a possible fallback, with a cost.
#
# Retrieved 2026-10-24 via WebFetch / WebSearch. "search-summary" evidence means the claim came from a
# search-result summary and the page itself was not opened; treat it as a pointer, not proof.
version: 1
retrieved: "2026-10-24"
priority_languages: [km, vi, th, es, en, zh, sw, hi, bn]

candidates:
