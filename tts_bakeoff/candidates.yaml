    evidence:
      - {claim: "license, languages, size, VRAM, cloning", url: "https://huggingface.co/openbmb/VoxCPM2", quote: "Apache-2.0 license, free for commercial use; 30 languages incl. Khmer, Thai, Vietnamese, Swahili; 2B parameters; ~8 GB", retrieved: "2026-10-24"}
