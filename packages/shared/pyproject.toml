[build-system]
requires = ["setuptools>=69.5.1", "wheel>=0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aoep-shared"
version = "0.2.0"
description = "Shared provider interfaces, local/cloud implementations, config factory, schemas, RAG, adaptive learning, assessment, and vision for the Agentic Online Education Platform."
license = { text = "LicenseRef-AOEP-Proprietary" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    # numpy backs the harvester course-composition matrix/scoring (and foresight).
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
test = [
    "pytest==8.2.2",
    # Harvest export is exercised in CI; keep pptx on the test extra so
    # `pip install -e packages/shared[test]` works without [harvest].
    "python-pptx==0.6.23",
    # Apple RS256 verification (test_shared_auth_security). Same pins as
    # services/identity/requirements.txt.
    "PyJWT==2.10.1",
    "cryptography==46.0.2",
]
# Self-hosted face recognition (perception service). Heavy/optional; not pulled
# in by services that don't need vision.
vision = [
    "opencv-contrib-python-headless==4.10.0.84",
    "onnxruntime==1.27.0",
    "numpy==2.2.6",
]
# Harvester binary-source extractors (PowerPoint / Word). Lazy-imported; only
# required when generating a course from .pptx / .docx files.
harvest = [
    "pypdf==4.2.0",
    "beautifulsoup4==4.12.3",
    "python-pptx==0.6.23",
    "python-docx==1.1.2",
]
presenter = [
    "edge-tts==6.1.12",
    "pymupdf==1.24.9",
]
# Video→CosyVoice training ingest (scripts/cosyvoice_ingest.py).
# yt-dlp downloads operator-supplied YouTube/Vimeo URLs; faster-whisper is
# local ASR (same pin family as theodore_music_lab[asr]). ffmpeg required on PATH.
# 2026.8.19 is the current stable release (YouTube bot-check fixes since 2025.9.26).
# Upgrade an existing venv with: pip install -e 'packages/shared[cosyvoice-ingest]'
# Nightly builds are optional and not pinned: pip install --pre 'yt-dlp>=2026.8.19'
cosyvoice-ingest = [
    "yt-dlp==2026.8.19",
    "faster-whisper==1.0.3",
    "requests>=2.31,<3",
]
# Vultr Object Storage (S3-compatible). Lazy-imported by CloudObjectStore;
# the local filesystem store does not need it.
object-store = [
    "boto3==1.43.108",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aoep_shared.training_agents" = ["data/*.json"]
"aoep_shared" = [
    "data/*.json",
    "data/content_packs/*/*.json",
    "data/content_packs/*/*.jsonl",
    "static/*.js",
    "static/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
