[pytest]
# The parallel webcam labs each ship tests/test_presence.py, test_silhouette.py,
# test_xai_voice.py and friends. Under pytest's default "prepend" import mode
# two same-named test modules collide and the whole run aborts with
# "import file mismatch". importlib mode keys modules by full path instead, so
# labs and services can use the same natural test filenames.
addopts = --import-mode=importlib
