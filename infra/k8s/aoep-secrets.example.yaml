# aoep-secrets — BOOTSTRAP TEMPLATE (do NOT add to any kustomization).
#
# This Secret is deliberately kept OUT of the applied kustomization so that a
# routine `kubectl apply -k infra/k8s-vke` can never overwrite real secret values
# with the "__INJECT__" placeholders (that was the recurring "LiveKit/DB breaks
# after every deploy" bug). Create/rotate it out of band instead:
#
#   Preferred (idempotent, never clobbers an existing Secret):
#     export LIVEKIT_API_KEY=...      LIVEKIT_API_SECRET=...
#     export DATABASE_URL=...         PAYMENT_API_KEY=...        # optional
#     export OBJECT_STORE_ACCESS_KEY=... OBJECT_STORE_SECRET_KEY=...  # optional
#     export NEMOTRON_API_KEY=...     LLM_API_KEY=...            # optional
#     export XAI_API_KEY=...          # optional Grok Voice Agent for Theodore
#     export ELEVENLABS_API_KEY=...   # optional neural TTS
#     bash scripts/k8s_bootstrap_secrets.sh
#
#   Update ONE value later (does not touch the others):
#     kubectl -n aoep patch secret aoep-secrets --type merge \
#       -p "{\"stringData\":{\"LIVEKIT_API_SECRET\":\"$LIVEKIT_API_SECRET\"}}"
#
# Services consume it via `envFrom: secretRef: { name: aoep-secrets }`, so the
# Secret MUST exist in the cluster (create it once before the first rollout).
# LiveKit note: LIVEKIT_API_KEY/SECRET must match the LiveKit Cloud project in
# LIVEKIT_URL (aoep-config). A LiveKit secret must be >= 32 chars.
apiVersion: v1
kind: Secret
metadata:
  name: aoep-secrets
  namespace: aoep
type: Opaque
stringData:
  LIVEKIT_API_KEY: "REPLACE_ME"
  LIVEKIT_API_SECRET: "REPLACE_ME"
  OBJECT_STORE_ACCESS_KEY: "REPLACE_ME"
  OBJECT_STORE_SECRET_KEY: "REPLACE_ME"
  DATABASE_URL: "postgresql://aoep:REPLACE_ME@postgres.aoep.internal:5432/aoep"
  PAYMENT_API_KEY: "REPLACE_ME"
  NEMOTRON_API_KEY: "REPLACE_ME"
  LLM_API_KEY: "REPLACE_ME"
  # xAI Grok Voice Agent — speech /voice/token for web + mobile Theodore.
  # Never commit a real key. Patch live:
  #   kubectl -n aoep patch secret aoep-secrets --type merge \
  #     -p '{"stringData":{"XAI_API_KEY":"xai-..."}}'
  XAI_API_KEY: "REPLACE_ME"
  ELEVENLABS_API_KEY: "REPLACE_ME"
  # Mirrors full reports/screenshots privately and redacted metadata publicly.
  # Repositories are non-secret ConfigMap values; token needs Issues + Contents
  # write access to the private repo and Issues write access to the public repo.
  BUG_REPORT_GITHUB_TOKEN: "REPLACE_ME"
  # Seed password for the default admin (identity). ROTATE for prod.
  DEFAULT_ADMIN_PASSWORD: "REPLACE_ME"
  QA_ACCOUNTS_PASSWORD: "REPLACE_ME"
