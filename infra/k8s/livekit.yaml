apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
  namespace: aoep
data:
  # Keys must match aoep-secrets LIVEKIT_API_KEY / LIVEKIT_API_SECRET.
  # Dev defaults work for smoke tests; rotate in production.
  livekit.yaml: |
    port: 7880
    rtc:
      tcp_port: 7881
      use_external_ip: true
    keys:
      devkey: devsecret
    logging:
      level: info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: aoep
  labels:
    app: livekit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      containers:
        - name: livekit
          image: livekit/livekit-server:v1.8.0
          args: ["--config", "/etc/livekit/livekit.yaml"]
          ports:
            - name: signal
              containerPort: 7880
              protocol: TCP
            - name: rtc-tcp
              containerPort: 7881
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/livekit
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /
              port: 7880
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 7880
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: livekit-config
---
apiVersion: v1
kind: Service
metadata:
  name: livekit
  namespace: aoep
  labels:
    app: livekit
spec:
  type: ClusterIP
  selector:
    app: livekit
  ports:
    - name: signal
      port: 7880
      targetPort: 7880
      protocol: TCP
    - name: rtc-tcp
      port: 7881
      targetPort: 7881
      protocol: TCP
