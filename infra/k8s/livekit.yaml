apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
  namespace: aoep
data:
  # API key/secret are NOT hardcoded here. They come from LIVEKIT_KEYS in the
  # Deployment below, built from the SAME aoep-secrets LIVEKIT_API_KEY/SECRET the
  # orchestrator signs tokens with, so the two can never drift. A mismatch makes
  # the server reject every minted token with 401 and video never connects.
  # Use a secret >= 32 chars in production (LiveKit rejects shorter secrets
  # outside --dev mode).
  livekit.yaml: |
    port: 7880
    rtc:
      tcp_port: 7881
      use_external_ip: true
    logging:
      level: info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: aoep
  labels:
    app: livekit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      containers:
        - name: livekit
          image: livekit/livekit-server:v1.8.0
          args: ["--config", "/etc/livekit/livekit.yaml"]
          env:
            # Single source of truth: LiveKit's keys are derived from the same
            # secret the orchestrator uses. LIVEKIT_KEYS ("key: secret") is
            # assembled via Kubernetes dependent env-var expansion, so the media
            # server and token issuer always agree.
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aoep-secrets
                  key: LIVEKIT_API_KEY
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: aoep-secrets
                  key: LIVEKIT_API_SECRET
            - name: LIVEKIT_KEYS
              value: "$(LIVEKIT_API_KEY): $(LIVEKIT_API_SECRET)"
          ports:
            - name: signal
              containerPort: 7880
              protocol: TCP
            - name: rtc-tcp
              containerPort: 7881
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/livekit
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /
              port: 7880
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 7880
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: livekit-config
---
apiVersion: v1
kind: Service
metadata:
  name: livekit
  namespace: aoep
  labels:
    app: livekit
spec:
  type: ClusterIP
  selector:
    app: livekit
  ports:
    - name: signal
      port: 7880
      targetPort: 7880
      protocol: TCP
    - name: rtc-tcp
      port: 7881
      targetPort: 7881
      protocol: TCP
