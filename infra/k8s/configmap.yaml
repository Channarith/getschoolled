# Non-secret cloud configuration. Secrets (LIVEKIT_API_SECRET, PAYMENT_API_KEY,
# DB password, object-store keys) come from a separate Secret, not this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aoep-config
  namespace: aoep
data:
  DEPLOY_MODE: "cloud"
  LLM_BASE_URL: "http://llm:8000/v1"
  LLM_MODEL: "aoep-base-edu"
  # NVIDIA Nemotron conversational agent (streaming, real-time) — ENABLED.
  # Routes the tutor + group-class AI host (Theodore) + voice assistant through a
  # self-hosted vLLM serving a Nemotron model (infra/k8s/nemotron-vllm.yaml,
  # Service "nemotron"). To use NVIDIA NIM instead, set NEMOTRON_BASE_URL to
  # https://integrate.api.nvidia.com/v1 and add NEMOTRON_API_KEY to aoep-secrets.
  LLM_PROVIDER: "nemotron"
  NEMOTRON_BASE_URL: "http://nemotron:8000/v1"
  NEMOTRON_MODEL: "nvidia/llama-3.1-nemotron-70b-instruct"
  # In-cluster service-to-service URLs (every service listens on :8000 and is
  # addressed by its Service name).
  SPEECH_BASE_URL: "http://speech:8000"
  VISION_BASE_URL: "http://perception:8000"
  # CosyVoice 2 (self-hosted GPU TTS, vLLM-accelerated) - see infra/k8s/cosyvoice.yaml.
  # When set, the speech gateway + presenter render narration through it. Empty
  # (or the Deployment absent) -> ElevenLabs/edge-tts/device-voice fallback.
  COSYVOICE_URL: "http://cosyvoice:9880"
  LIVEKIT_URL: "wss://livekit.aoep.example"
  OBJECT_STORE_ENDPOINT: "https://s3.amazonaws.com"
  OBJECT_STORE_BUCKET: "aoep-prod"
  REDIS_URL: "redis://redis:6379/0"
  CURRICULUM_DIR: "/app/sample-curriculum"
  # Default admin seeding (identity service). Accounts persist to Redis when
  # REDIS_URL is set so multi-replica identity pods share the same members.
  SEED_DEFAULT_ADMIN: "1"
  DEFAULT_ADMIN_EMAIL: "admin@salareen.com"
  DEFAULT_ADMIN_USERNAME: "admin"
  # QA personas for manual/release testing (password in Secret). SEED_QA_ACCOUNTS=0
  # disables them on a production deployment.
  SEED_QA_ACCOUNTS: "1"
  # Careers: serve REAL job openings from public boards (Remotive + Arbeitnow;
  # no key, falls back to the curated board if egress is blocked). Add a
  # RAPIDAPI_KEY (JSearch -> LinkedIn/Indeed/Glassdoor) or ADZUNA_APP_ID/KEY via
  # the Secret to index those sources too.
  JOBS_LIVE: "1"
  ORCHESTRATOR_URL: "https://api.aoep.example"
  # Browser-facing API bases for the web app. By DEFAULT the web bundle derives
  # these from the page origin + a same-origin path prefix (apps/web/app/lib/api.ts),
  # which the Ingress rewrites to each Service - so the values below are RELATIVE
  # prefixes and work on a bare LB IP or any domain with no DNS for api/app
  # subdomains. They are only needed if you want to pin the web image to absolute
  # cross-origin API hosts (Next.js inlines NEXT_PUBLIC_* at BUILD time, so they
  # must be passed as build args to take effect; left as relative defaults, the
  # browser's same-origin resolution already works without any build args).
  NEXT_PUBLIC_ORCHESTRATOR_URL: "/orchestrator"
  NEXT_PUBLIC_CURRICULUM_URL: "/curriculum"
  NEXT_PUBLIC_IDENTITY_URL: "/identity"
  NEXT_PUBLIC_MEMORY_URL: "/memory"
  NEXT_PUBLIC_SPEECH_URL: "/speech"
  NEXT_PUBLIC_BILLING_URL: "/billing"
  NEXT_PUBLIC_INTEGRATIONS_URL: "/integrations"
  NEXT_PUBLIC_PERCEPTION_URL: "/perception"
  # Mobile app download targets for the /download page (empty -> "Coming soon").
  # Like other NEXT_PUBLIC_*, these are inlined at web build time.
  NEXT_PUBLIC_ANDROID_APK_URL: ""
  NEXT_PUBLIC_PLAY_STORE_URL: ""
  NEXT_PUBLIC_IOS_APP_URL: ""
  NEXT_PUBLIC_APP_STORE_URL: ""
  # Server-side BFF for operator admins (Next.js API routes proxy to memory/identity).
  ADMIN_SECRET: "dev-admin-secret"
  # IDENTITY_URL is what the shared helpers read (admin /auth/me check, rewards);
  # IDENTITY_ORIGIN is kept as a fallback alias.
  IDENTITY_URL: "http://identity:8000"
  IDENTITY_ORIGIN: "http://identity:8000"
  MEMORY_URL: "http://memory:8000"
  MEMORY_ORIGIN: "http://memory:8000"
# NOTE: the `aoep-secrets` Secret is intentionally NOT defined in this (applied)
# file anymore. It used to live here, which meant `kubectl apply -k` reset every
# real secret value (LIVEKIT_API_*, DB, payments, ...) back to "__INJECT__" on
# EVERY deploy — the recurring "LiveKit keeps breaking after I deploy" trap. The
# Secret is now managed OUT OF BAND so applies can never clobber it: bootstrap it
# once with `scripts/k8s_bootstrap_secrets.sh` (template + docs in
# infra/k8s/aoep-secrets.example.yaml). `apply -k` no longer touches secrets.
