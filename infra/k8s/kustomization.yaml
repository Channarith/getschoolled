apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aoep
resources:
  - namespace.yaml
  - configmap.yaml
  - services.yaml
  - autoscaling.yaml
  - redis.yaml
  # Self-hosted LiveKit is NOT deployed by default — Salareen uses LiveKit Cloud
  # (LIVEKIT_URL in configmap-vke.yaml). To self-host instead, re-add livekit.yaml
  # here and livekit-ingress-vke.yaml to the k8s-vke overlay.
  - ingress.yaml
  - ingress-origin.yaml
  - llm-vllm.yaml
  - nemotron-vllm.yaml
  - cosyvoice.yaml
  - harvester.yaml
  - retention-cronjob.yaml
