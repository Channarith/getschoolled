apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aoep
  namespace: aoep
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    # Sticky sessions so live-class sessions (kept in-memory by the orchestrator)
    # don't 404 across its replicas. See infra/k8s/ingress.yaml for rationale.
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/session-cookie-name: "salareen_aff"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
    nginx.ingress.kubernetes.io/session-cookie-path: "/"
    nginx.ingress.kubernetes.io/limit-rps: "60"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-connections: "200"
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout http_502 http_503"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    # WebSocket connections for /api/live-rooms/*/ws stay open for the full class
    # duration (45–90 min). read-timeout governs how long nginx waits between data
    # frames — 60 s would kill an idle WebSocket; 3600 s keeps it alive.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Explicit WebSocket upgrade pass-through (belt-and-suspenders with TLS).
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    # Force HTTP → HTTPS once cert-manager has issued salareen-tls (already live).
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.salareen.com, www.salareen.com, salareen.com]
      secretName: salareen-tls
  rules:
    - host: www.salareen.com
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend: { service: { name: orchestrator, port: { number: 8000 } } }
          - path: /health
            pathType: Prefix
            backend: { service: { name: orchestrator, port: { number: 8000 } } }
          - path: /home
            pathType: Prefix
            backend: { service: { name: curriculum, port: { number: 8000 } } }
          - path: /audio
            pathType: Prefix
            backend: { service: { name: curriculum, port: { number: 8000 } } }
          - path: /courses
            pathType: Prefix
            backend: { service: { name: curriculum, port: { number: 8000 } } }
          # Careers UI (Next.js). API lives at /curriculum/jobs via aoep-apis.
          - path: /jobs
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
          - path: /notifications
            pathType: Prefix
            backend: { service: { name: curriculum, port: { number: 8000 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
    - host: salareen.com
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend: { service: { name: orchestrator, port: { number: 8000 } } }
          - path: /health
            pathType: Prefix
            backend: { service: { name: orchestrator, port: { number: 8000 } } }
          - path: /home
            pathType: Prefix
            backend: { service: { name: curriculum, port: { number: 8000 } } }
          - path: /audio
            pathType: Prefix
            backend: { service: { name: curriculum, port: { number: 8000 } } }
          - path: /courses
            pathType: Prefix
            backend: { service: { name: curriculum, port: { number: 8000 } } }
          # Careers UI (Next.js). API lives at /curriculum/jobs via aoep-apis.
          - path: /jobs
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
          - path: /notifications
            pathType: Prefix
            backend: { service: { name: curriculum, port: { number: 8000 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
    - host: api.salareen.com
      http:
        paths:
          - path: /home
            pathType: Prefix
            backend: { service: { name: curriculum, port: { number: 8000 } } }
          - path: /audio
            pathType: Prefix
            backend: { service: { name: curriculum, port: { number: 8000 } } }
          - path: /courses
            pathType: Prefix
            backend: { service: { name: curriculum, port: { number: 8000 } } }
          - path: /jobs
            pathType: Prefix
            backend: { service: { name: curriculum, port: { number: 8000 } } }
          - path: /notifications
            pathType: Prefix
            backend: { service: { name: curriculum, port: { number: 8000 } } }
          - path: /api/
            pathType: Prefix
            backend: { service: { name: orchestrator, port: { number: 8000 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: orchestrator, port: { number: 8000 } } }
    # NOTE: the bare-IP catch-all rule was removed. Previously it allowed
    # http://45.63.91.80/... to reach the API as a failover, but with
    # ssl-redirect: true that became https://45.63.91.80/... — which serves
    # nginx's default self-signed cert and shows "This site is unsafe" in Chrome.
    # The mobile failover now uses https://api.salareen.com instead.
---
# VKE patch for the per-service API Ingress (base: infra/k8s/ingress.yaml,
# name: aoep-apis). Re-points the rewrite-prefix API routes at api.salareen.com
# with the Salareen TLS secret + cert-manager. The web app reaches every backend
# collision-free via https://api.salareen.com/<svc>/... (see NEXT_PUBLIC_*_URL in
# configmap-vke.yaml). Each /<svc>/ prefix is stripped before forwarding.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aoep-apis
  namespace: aoep
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.salareen.com, www.salareen.com, salareen.com]
      secretName: salareen-tls
  rules:
    - host: api.salareen.com
      http:
        paths:
          - path: /orchestrator(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: orchestrator, port: { number: 8000 } } }
          - path: /curriculum(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: curriculum, port: { number: 8000 } } }
          - path: /identity(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: identity, port: { number: 8000 } } }
          - path: /integrations(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: integrations, port: { number: 8000 } } }
          - path: /memory(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: memory, port: { number: 8000 } } }
          - path: /speech(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: speech, port: { number: 8000 } } }
          - path: /billing(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: billing, port: { number: 8000 } } }
          - path: /perception(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: perception, port: { number: 8000 } } }
    # www / apex: browser same-origin /identity, /memory, … (learning profile save)
    - host: www.salareen.com
      http:
        paths:
          - path: /orchestrator(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: orchestrator, port: { number: 8000 } } }
          - path: /curriculum(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: curriculum, port: { number: 8000 } } }
          - path: /identity(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: identity, port: { number: 8000 } } }
          - path: /integrations(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: integrations, port: { number: 8000 } } }
          - path: /memory(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: memory, port: { number: 8000 } } }
          - path: /speech(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: speech, port: { number: 8000 } } }
          - path: /billing(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: billing, port: { number: 8000 } } }
          - path: /perception(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: perception, port: { number: 8000 } } }
    - host: salareen.com
      http:
        paths:
          - path: /orchestrator(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: orchestrator, port: { number: 8000 } } }
          - path: /curriculum(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: curriculum, port: { number: 8000 } } }
          - path: /identity(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: identity, port: { number: 8000 } } }
          - path: /integrations(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: integrations, port: { number: 8000 } } }
          - path: /memory(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: memory, port: { number: 8000 } } }
          - path: /speech(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: speech, port: { number: 8000 } } }
          - path: /billing(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: billing, port: { number: 8000 } } }
          - path: /perception(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: perception, port: { number: 8000 } } }
    # Bare LoadBalancer IP / any host: same-origin /identity, /memory, etc.
    - http:
        paths:
          - path: /orchestrator(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: orchestrator, port: { number: 8000 } } }
          - path: /curriculum(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: curriculum, port: { number: 8000 } } }
          - path: /identity(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: identity, port: { number: 8000 } } }
          - path: /integrations(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: integrations, port: { number: 8000 } } }
          - path: /memory(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: memory, port: { number: 8000 } } }
          - path: /speech(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: speech, port: { number: 8000 } } }
          - path: /billing(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: billing, port: { number: 8000 } } }
          - path: /perception(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: perception, port: { number: 8000 } } }
---
# Bare-IP HTTP redirect — catches http://45.63.91.80/... (plain HTTP only) and
# sends a 301 to https://www.salareen.com. Separate from the main ingress so
# ssl-redirect: false here prevents the HTTP→HTTPS bounce to the un-certifiable
# bare IP. https://45.63.91.80 will always show "Dangerous" in Chrome because
# TLS certificates cannot cover bare IP addresses — that is expected and
# harmless. The canonical URL https://www.salareen.com is always correct.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aoep-ip-redirect
  namespace: aoep
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/permanent-redirect: "https://www.salareen.com"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
