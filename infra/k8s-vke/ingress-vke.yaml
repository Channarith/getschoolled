apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aoep
  namespace: aoep
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    # Sticky sessions so live-class sessions (kept in-memory by the orchestrator)
    # don't 404 across its replicas. See infra/k8s/ingress.yaml for rationale.
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/session-cookie-name: "salareen_aff"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
    nginx.ingress.kubernetes.io/session-cookie-path: "/"
    nginx.ingress.kubernetes.io/limit-rps: "60"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-connections: "200"
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout http_502 http_503"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    # WebSocket connections for /api/live-rooms/*/ws stay open for the full class
    # duration (45–90 min). read-timeout governs how long nginx waits between data
    # frames — 60 s would kill an idle WebSocket; 3600 s keeps it alive.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Explicit WebSocket upgrade pass-through (belt-and-suspenders with TLS).
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    # Force HTTP → HTTPS once cert-manager has issued salareen-tls (already live).
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Branded mascot pages for gateway failures (HTML for browsers, JSON for API clients).
    # Only 502/503/504: they replace the upstream body, and app-level 404/500 bodies carry detail.
    nginx.ingress.kubernetes.io/custom-http-errors: "502,503,504"
    nginx.ingress.kubernetes.io/default-backend: friendly-errors
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.salareen.com, www.salareen.com, salareen.com]
      secretName: salareen-tls
  rules:
    - host: www.salareen.com
      http:
        paths:
          # Next.js BFF admin routes — must precede /api/ (longest prefix wins).
          - path: /api/admin/
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
          # Course Studio and the children lab. /api/ below is the orchestrator,
          # which 404s these. Longer prefixes win, so the demos reach the labs.
          - path: /api/studio
            pathType: Prefix
            backend: { service: { name: course-studio, port: { number: 8040 } } }
          - path: /api/live-audio
            pathType: Prefix
            backend: { service: { name: course-studio, port: { number: 8040 } } }
          - path: /api/child
            pathType: Prefix
            backend: { service: { name: children-lab, port: { number: 8018 } } }
          - path: /api/tts
            pathType: Prefix
            backend: { service: { name: children-lab, port: { number: 8018 } } }
          - path: /api/
            pathType: Prefix
            backend: { service: { name: orchestrator, port: { number: 8000 } } }
          - path: /health
            pathType: Prefix
            backend: { service: { name: orchestrator, port: { number: 8000 } } }
          - path: /home
            pathType: Prefix
            backend: { service: { name: curriculum, port: { number: 8000 } } }
          # nginx prefix /home also matches /homework and /home-concepts (web pages).
          # Longer paths win, so pin them to web.
          - path: /homework
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
          - path: /home-concepts
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
          # nginx prefix /audio also matches /audio-lab. Curriculum then
          # returns {"detail":"Not Found"}. Longer paths win and must hit the
          # web rewrites, which proxy to the audio-lab Service.
          - path: /audio-lab-api
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
          - path: /audio-lab
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
          - path: /audio
            pathType: Prefix
            backend: { service: { name: curriculum, port: { number: 8000 } } }
          - path: /courses
            pathType: Prefix
            backend: { service: { name: curriculum, port: { number: 8000 } } }
          # Careers UI (Next.js). API lives at /curriculum/jobs via aoep-apis.
          - path: /jobs
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
          - path: /notifications
            pathType: Prefix
            backend: { service: { name: curriculum, port: { number: 8000 } } }
          # Membership page is the Next.js app. /billing/<route> stays on
          # aoep-apis and is rewritten to the billing service. Exact wins over
          # that regex, and this Ingress does not rewrite the page to /.
          - path: /billing
            pathType: Exact
            backend: { service: { name: web, port: { number: 80 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
    - host: salareen.com
      http:
        paths:
          # Next.js BFF admin routes — must precede /api/ (longest prefix wins).
          - path: /api/admin/
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
          # Course Studio and the children lab. /api/ below is the orchestrator,
          # which 404s these. Longer prefixes win, so the demos reach the labs.
          - path: /api/studio
            pathType: Prefix
            backend: { service: { name: course-studio, port: { number: 8040 } } }
          - path: /api/live-audio
            pathType: Prefix
            backend: { service: { name: course-studio, port: { number: 8040 } } }
          - path: /api/child
            pathType: Prefix
            backend: { service: { name: children-lab, port: { number: 8018 } } }
          - path: /api/tts
            pathType: Prefix
            backend: { service: { name: children-lab, port: { number: 8018 } } }
          - path: /api/
            pathType: Prefix
            backend: { service: { name: orchestrator, port: { number: 8000 } } }
          - path: /health
            pathType: Prefix
            backend: { service: { name: orchestrator, port: { number: 8000 } } }
          - path: /home
            pathType: Prefix
            backend: { service: { name: curriculum, port: { number: 8000 } } }
          # nginx prefix /home also matches /homework and /home-concepts (web pages).
          # Longer paths win, so pin them to web.
          - path: /homework
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
          - path: /home-concepts
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
          # nginx prefix /audio also matches /audio-lab. Curriculum then
          # returns {"detail":"Not Found"}. Longer paths win and must hit the
          # web rewrites, which proxy to the audio-lab Service.
          - path: /audio-lab-api
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
          - path: /audio-lab
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
          - path: /audio
            pathType: Prefix
            backend: { service: { name: curriculum, port: { number: 8000 } } }
          - path: /courses
            pathType: Prefix
            backend: { service: { name: curriculum, port: { number: 8000 } } }
          # Careers UI (Next.js). API lives at /curriculum/jobs via aoep-apis.
          - path: /jobs
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
          - path: /notifications
            pathType: Prefix
            backend: { service: { name: curriculum, port: { number: 8000 } } }
          # Same as www: the browser page is /billing, the API is /billing/<route>.
          - path: /billing
            pathType: Exact
            backend: { service: { name: web, port: { number: 80 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
    - host: api.salareen.com
      http:
        paths:
          - path: /home
            pathType: Prefix
            backend: { service: { name: curriculum, port: { number: 8000 } } }
          # nginx prefix /audio also matches /audio-lab. Curriculum then
          # returns {"detail":"Not Found"}. Longer paths win and must hit the
          # web rewrites, which proxy to the audio-lab Service.
          - path: /audio-lab-api
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
          - path: /audio-lab
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
          - path: /audio
            pathType: Prefix
            backend: { service: { name: curriculum, port: { number: 8000 } } }
          - path: /courses
            pathType: Prefix
            backend: { service: { name: curriculum, port: { number: 8000 } } }
          - path: /jobs
            pathType: Prefix
            backend: { service: { name: curriculum, port: { number: 8000 } } }
          - path: /notifications
            pathType: Prefix
            backend: { service: { name: curriculum, port: { number: 8000 } } }
          # Course Studio and the children lab. /api/ below is the orchestrator,
          # which 404s these. Longer prefixes win, so the demos reach the labs.
          - path: /api/studio
            pathType: Prefix
            backend: { service: { name: course-studio, port: { number: 8040 } } }
          - path: /api/live-audio
            pathType: Prefix
            backend: { service: { name: course-studio, port: { number: 8040 } } }
          - path: /api/child
            pathType: Prefix
            backend: { service: { name: children-lab, port: { number: 8018 } } }
          - path: /api/tts
            pathType: Prefix
            backend: { service: { name: children-lab, port: { number: 8018 } } }
          - path: /api/
            pathType: Prefix
            backend: { service: { name: orchestrator, port: { number: 8000 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: orchestrator, port: { number: 8000 } } }
    # Bare IP is served by the separate `aoep-ip` Ingress (ssl-redirect: false)
    # so http://45.63.91.80 stays on the cluster instead of bouncing to HTTPS on
    # an un-certifiable IP or redirecting to www. Mobile failover uses
    # https://api.salareen.com.
---
# VKE patch for the per-service API Ingress (base: infra/k8s/ingress.yaml,
# name: aoep-apis). Re-points the rewrite-prefix API routes at api.salareen.com
# with the Salareen TLS secret + cert-manager. The web app reaches every backend
# collision-free via https://api.salareen.com/<svc>/... (see NEXT_PUBLIC_*_URL in
# configmap-vke.yaml). Each /<svc>/ prefix is stripped before forwarding.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aoep-apis
  namespace: aoep
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/limit-rps: "60"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Branded mascot pages for gateway failures (HTML for browsers, JSON for API clients).
    # Only 502/503/504: they replace the upstream body, and app-level 404/500 bodies carry detail.
    nginx.ingress.kubernetes.io/custom-http-errors: "502,503,504"
    nginx.ingress.kubernetes.io/default-backend: friendly-errors
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.salareen.com, www.salareen.com, salareen.com]
      secretName: salareen-tls
  rules:
    - host: api.salareen.com
      http:
        paths:
          - path: /orchestrator(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: orchestrator, port: { number: 8000 } } }
          - path: /curriculum(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: curriculum, port: { number: 8000 } } }
          - path: /identity(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: identity, port: { number: 8000 } } }
          - path: /integrations(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: integrations, port: { number: 8000 } } }
          - path: /memory(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: memory, port: { number: 8000 } } }
          - path: /speech(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: speech, port: { number: 8000 } } }
          - path: /billing(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: billing, port: { number: 8000 } } }
          - path: /perception(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: perception, port: { number: 8000 } } }
    # www / apex: browser same-origin /identity, /memory, … (learning profile save)
    - host: www.salareen.com
      http:
        paths:
          - path: /orchestrator(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: orchestrator, port: { number: 8000 } } }
          - path: /curriculum(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: curriculum, port: { number: 8000 } } }
          - path: /identity(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: identity, port: { number: 8000 } } }
          - path: /integrations(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: integrations, port: { number: 8000 } } }
          - path: /memory(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: memory, port: { number: 8000 } } }
          - path: /speech(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: speech, port: { number: 8000 } } }
          - path: /billing(/)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: billing, port: { number: 8000 } } }
          - path: /perception(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: perception, port: { number: 8000 } } }
    - host: salareen.com
      http:
        paths:
          - path: /orchestrator(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: orchestrator, port: { number: 8000 } } }
          - path: /curriculum(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: curriculum, port: { number: 8000 } } }
          - path: /identity(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: identity, port: { number: 8000 } } }
          - path: /integrations(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: integrations, port: { number: 8000 } } }
          - path: /memory(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: memory, port: { number: 8000 } } }
          - path: /speech(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: speech, port: { number: 8000 } } }
          - path: /billing(/)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: billing, port: { number: 8000 } } }
          - path: /perception(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: perception, port: { number: 8000 } } }
    # Bare LoadBalancer IP / any host: same-origin /identity, /memory, etc.
    - http:
        paths:
          # Next.js UI pages that share a name with nothing in the API list.
          # /billing itself is an Exact path on the web Ingress (aoep / aoep-ip).
          # Do not put it here: this Ingress rewrites /$2, so an exact /billing
          # would be forwarded to the web app as / and the membership page
          # would never render. /billing/<route> below still hits the API.
          - path: /account
            pathType: Exact
            backend: { service: { name: web, port: { number: 80 } } }
          - path: /security
            pathType: Exact
            backend: { service: { name: web, port: { number: 80 } } }
          - path: /rewards
            pathType: Exact
            backend: { service: { name: web, port: { number: 80 } } }
          - path: /my-list
            pathType: Exact
            backend: { service: { name: web, port: { number: 80 } } }
          - path: /onboarding
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
          - path: /orchestrator(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: orchestrator, port: { number: 8000 } } }
          - path: /curriculum(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: curriculum, port: { number: 8000 } } }
          - path: /identity(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: identity, port: { number: 8000 } } }
          - path: /integrations(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: integrations, port: { number: 8000 } } }
          - path: /memory(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: memory, port: { number: 8000 } } }
          - path: /speech(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: speech, port: { number: 8000 } } }
          - path: /billing(/)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: billing, port: { number: 8000 } } }
          - path: /perception(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: perception, port: { number: 8000 } } }
