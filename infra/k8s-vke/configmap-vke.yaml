apiVersion: v1
kind: ConfigMap
metadata:
  name: aoep-config
  namespace: aoep
data:
  DEPLOY_MODE: "cloud"
  LLM_BASE_URL: "http://llm:8000/v1"
  LLM_MODEL: "aoep-base-edu"
  # NVIDIA Nemotron conversational agent (streaming, real-time) — ENABLED.
  # Routes the tutor + group-class AI host (Theodore) + voice assistant through a
  # self-hosted vLLM Nemotron (infra/k8s/nemotron-vllm.yaml, Service "nemotron").
  # To use NVIDIA NIM instead, set NEMOTRON_BASE_URL=https://integrate.api.nvidia.com/v1
  # and add NEMOTRON_API_KEY to aoep-secrets.
  LLM_PROVIDER: "nemotron"
  NEMOTRON_BASE_URL: "http://nemotron:8000/v1"
  NEMOTRON_MODEL: "nvidia/llama-3.1-nemotron-70b-instruct"
  SPEECH_BASE_URL: "http://speech:8000"
  VISION_BASE_URL: "http://perception:8000"
  # CosyVoice 2 GPU TTS (vLLM-accelerated) in-cluster; see infra/k8s/cosyvoice.yaml.
  COSYVOICE_URL: "http://cosyvoice:9880"
  XAI_VOICE_MODEL: "grok-voice-latest"
  XAI_VOICE_ID: "eve"
  # LiveKit Cloud project URL (managed — NOT the self-hosted infra/k8s/livekit.yaml
  # server, which is unused when on Cloud). The orchestrator stamps this URL into
  # every join token, so clients connect here. It MUST belong to the same LiveKit
  # Cloud project as LIVEKIT_API_KEY/LIVEKIT_API_SECRET in aoep-secrets, or tokens
  # 401 / video never connects. Not a secret (clients dial it directly).
  LIVEKIT_URL: "wss://salareen-q3lne5d9.livekit.cloud"
  OBJECT_STORE_ENDPOINT: "https://sjc1.vultrobjects.com"
  OBJECT_STORE_BUCKET: "salareen-prod"
  REDIS_URL: "redis://redis.aoep.svc.cluster.local:6379/0"
  # Live rooms + group classes share Redis across orchestrator replicas (VKE HPA).
  # LIVE_ROOM_BACKEND=memory forces per-pod rooms (tests only).
  CURRICULUM_DIR: "/app/sample-curriculum"
  # Default admin seeding (identity). In-memory store re-seeds on every restart so
  # admin@salareen.com is usable out of the box; SEED_DEFAULT_ADMIN=0 disables it.
  # Password is in the Secret (aoep-secrets/DEFAULT_ADMIN_PASSWORD) - rotate it.
  SEED_DEFAULT_ADMIN: "1"
  DEFAULT_ADMIN_EMAIL: "admin@salareen.com"
  DEFAULT_ADMIN_USERNAME: "admin"
  SEED_QA_ACCOUNTS: "1"
  # Careers: real job openings from Indeed RSS, RemoteOK, Remotive, and Arbeitnow
  # (all free, no key required). To add LinkedIn/Glassdoor/ZipRecruiter listings
  # via JSearch set RAPIDAPI_KEY in aoep-secrets; for Adzuna set ADZUNA_APP_ID +
  # ADZUNA_APP_KEY. Both keys live in the out-of-band aoep-secrets Secret.
  JOBS_LIVE: "1"
  ORCHESTRATOR_URL: "https://api.salareen.com"
  # Browser-facing API bases. Same-origin RELATIVE prefixes by default: the web
  # bundle prepends the page origin and the (hostless) Ingress rewrites each
  # /<svc>/ prefix to its Service, so this works over the bare LB IP or
  # salareen.com without separate api/app DNS. Set to absolute hosts only if you
  # intentionally serve the API on a different origin (then build the web image
  # with these as build args, since Next.js inlines NEXT_PUBLIC_* at build time).
  NEXT_PUBLIC_ORCHESTRATOR_URL: "/orchestrator"
  NEXT_PUBLIC_CURRICULUM_URL: "/curriculum"
  NEXT_PUBLIC_IDENTITY_URL: "/identity"
  NEXT_PUBLIC_MEMORY_URL: "/memory"
  NEXT_PUBLIC_SPEECH_URL: "/speech"
  NEXT_PUBLIC_BILLING_URL: "/billing"
  NEXT_PUBLIC_INTEGRATIONS_URL: "/integrations"
  NEXT_PUBLIC_PERCEPTION_URL: "/perception"
  # Server-to-server identity/memory base URLs. IDENTITY_URL is what the shared
  # helpers actually read (admin check via /auth/me, rewards spend/earn); without
  # it the orchestrator fell back to localhost and platform-admin actions 403'd.
  IDENTITY_URL: "http://identity:8000"
  IDENTITY_ORIGIN: "http://identity:8000"
  MEMORY_URL: "http://memory:8000"
  MEMORY_ORIGIN: "http://memory:8000"
  # ADMIN_SECRET must NOT be set here — it is a secret and is injected via the
  # aoep-secrets Secret (key: admin-secret) which is already mounted in every
  # deployment via `secretRef: { name: aoep-secrets }`. Keeping it in a
  # ConfigMap exposes it in plaintext to anyone who can read ConfigMaps.
  # Default-on floating user QA button; set "0" when production is ready.
  IN_APP_BUG_REPORTER_ENABLED: "1"
  # Full evidence/screenshots stay private; public issues contain metadata only.
  # BUG_REPORT_GITHUB_TOKEN remains in the out-of-band aoep-secrets Secret.
  BUG_REPORT_GITHUB_PRIVATE_REPO: "Channarith/salareen-bug-reports"
  BUG_REPORT_GITHUB_PUBLIC_REPO: "Channarith/getschoolled"
  # Mobile app download targets for /download (empty -> "Coming soon"). Set these
  # to the hosted APK + Play/App Store links once published; inlined at build.
  NEXT_PUBLIC_ANDROID_APK_URL: "https://salareen-prod.sjc1.vultrobjects.com/releases/android/v0.26.1/app-release.apk"
  NEXT_PUBLIC_PLAY_STORE_URL: ""
  NEXT_PUBLIC_IOS_APP_URL: "https://testflight.apple.com/join/uTxcWnCZ"
  NEXT_PUBLIC_APP_STORE_URL: ""
