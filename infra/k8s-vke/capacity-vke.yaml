---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing
  namespace: aoep
spec:
  template:
    spec:
      containers:
        - name: billing
          resources:
            requests:
              cpu: 50m
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: billing
  namespace: aoep
spec:
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 85
