# VKE capacity: the four working nodes are full, so a rolling update that needs a
# surge pod never schedules and the rollout hangs (perception sat stuck for 13h).
# Roll in place instead: take one pod down, start its replacement.
# The GPU-only workloads need an aoep.gpu/pool node that this cluster does not
# have; parked at 0 so they stop sitting Pending and driving autoscaler churn.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: perception
  namespace: aoep
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  namespace: aoep
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: aoep
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing
  namespace: aoep
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curriculum
  namespace: aoep
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: integrations
  namespace: aoep
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory
  namespace: aoep
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speech
  namespace: aoep
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm
  namespace: aoep
spec:
  replicas: 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cosyvoice
  namespace: aoep
spec:
  replicas: 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nemotron
  namespace: aoep
spec:
  replicas: 0

# --- CPU requests (v0.96.8) -------------------------------------------------
# Only four nodes can run pods (the Vultr cloud controller never initializes new
# ones), and they were 92-100% CPU-requested, so rollouts left pods Pending and the
# autoscaler kept adding nodes that cannot be used. Requests are scheduling weights,
# not caps: limits are unchanged, so a busy pod can still burst. HPA ceilings are
# lowered to what four nodes can hold, and the CPU target is raised because the
# same usage is now a larger share of a smaller request.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: perception
  namespace: aoep
spec:
  template:
    spec:
      containers:
        - name: perception
          resources:
            requests:
              cpu: 100m
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: aoep
spec:
  template:
    spec:
      containers:
        - name: web
          resources:
            requests:
              cpu: 100m
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speech
  namespace: aoep
spec:
  template:
    spec:
      containers:
        - name: speech
          resources:
            requests:
              cpu: 100m
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: aoep
spec:
  template:
    spec:
      containers:
        - name: orchestrator
          resources:
            requests:
              cpu: 100m
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curriculum
  namespace: aoep
spec:
