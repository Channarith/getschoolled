# Deletes Node objects for machines the cluster autoscaler already removed.
# Vultr cloud controller is not removing them (see the Vultr ticket), so every
# scale-down left a NotReady node plus a crash-looping calico-node pod behind.
# Only nodes that carry the autoscaler ToBeDeleted taint AND have been NotReady
# for more than MIN_AGE_SECONDS are touched; Ready nodes are never selected.
apiVersion: v1
kind: ServiceAccount
metadata: {name: stale-node-reaper, namespace: kube-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: stale-node-reaper}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: stale-node-reaper}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: stale-node-reaper}
subjects:
  - {kind: ServiceAccount, name: stale-node-reaper, namespace: kube-system}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: stale-node-reaper, namespace: kube-system}
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        spec:
          serviceAccountName: stale-node-reaper
          restartPolicy: Never
          containers:
            - name: reaper
              image: alpine/k8s:1.30.2
              env:
                - {name: MIN_AGE_SECONDS, value: "1200"}
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {cpu: 100m, memory: 128Mi}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  now=$(date +%s)
                  kubectl get nodes -o json | jq -r --argjson now "$now" --argjson age "${MIN_AGE_SECONDS:-1200}" '
                    .items[]
                    | select(any(.spec.taints[]?; .key=="ToBeDeletedByClusterAutoscaler"))
                    | select(any(.status.conditions[]?; .type=="Ready" and .status!="True" and (((.lastTransitionTime|fromdateiso8601)) < ($now-$age))))
                    | .metadata.name' > /tmp/stale.txt
                  echo "stale nodes: $(wc -l < /tmp/stale.txt)"
                  [ -s /tmp/stale.txt ] && xargs -r kubectl delete node < /tmp/stale.txt || true
