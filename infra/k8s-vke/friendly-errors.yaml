    <body><main class="sfe-screen" role="alert"><div class="sfe-stars"></div><div class="sfe-card"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="240" height="260" role="img" aria-label="Sala, the Salareen mascot" class="sfe-art sfe-surprised">
    <title>Sala, the Salareen mascot</title><style>.sfe-tear{animation:sfeTear 2.2s ease-in infinite;transform-box:fill-box}
