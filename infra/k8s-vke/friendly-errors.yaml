    <style>html,body{margin:0;height:100%;background:#0b1020}.sfe-screen{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;padding:20px;overflow:auto;color:#eef2ff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(1200px 700px at 50% 0%,#1d2a58 0%,#0b1020 62%)}
