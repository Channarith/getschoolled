# Kal-el (iBuyPower, RTX 5060 Ti 8 GB VRAM) QLoRA settings.
# Fits models up to about 4B parameters (llama-3.2-3b, qwen3-4b, gemma-3-4b).
# 7B+ belongs on the Spark (see finetune.spark.yaml). One GPU job at a time;
# keep 6 GB system RAM free (GS_PROFILE=ibuypower).

base_model: llama-3.2-3b-instruct
method: qlora
precision: bf16

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]

data:
  conditioning_features: [age_band, language, reading_level, learning_style, professionalism, prior_mastery]

optim:
  lr: 0.0002
  epochs_per_cycle: 1
  batch_size: 1
  grad_accum: 16
  max_length: 384

schedule:
  mode: once
  min_new_examples: 1

evaluation:
  promote_if:
    accuracy_gain_min: 0.0
    fairness_regression_max: 0.0
  fairness_groups_for_monitoring_only: [language, reading_level]
  max_fairness_gap: 0.1

serving:
  provider: vllm
  rollout: canary
