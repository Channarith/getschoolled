# Spark (GB10, shared GPU) QLoRA settings. The default finetune.yaml batch is
# sized for a dedicated training box. This file keeps one STEM adapter run
# small enough to sit beside CosyVoice and the llama-servers.
#
# Weights stay outside the repo (models/weights/ or output/spark/).

base_model: qwen2.5-7b-instruct
method: qlora
precision: bf16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]

data:
  conditioning_features: [age_band, language, reading_level, learning_style, professionalism, prior_mastery]

optim:
  lr: 0.0002
  epochs_per_cycle: 1
  batch_size: 1
  grad_accum: 8
  max_length: 512

schedule:
  mode: once
  min_new_examples: 1

evaluation:
  promote_if:
    accuracy_gain_min: 0.0
    fairness_regression_max: 0.0
  fairness_groups_for_monitoring_only: [language, reading_level]
  max_fairness_gap: 0.1

serving:
  provider: vllm
  rollout: canary
