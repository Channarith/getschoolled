[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "webcam-vision-lab"
version = "0.1.0"
description = "Private R&D lab for webcam presence, silhouette, and xAI voice agents"
readme = "README.txt"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
vision = [
    "opencv-contrib-python-headless>=4.10.0",
    "onnxruntime>=1.17.0",
    "numpy>=1.26.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
