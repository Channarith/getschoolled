[Service]
# Cap on ingest workers (the reboot policy may ask for fewer, never more). Raise it only after watching the GPU.
Environment=AOEP_INGEST_MAX_WORKERS=1
# NOTE: the old drop-in gpu.conf forced AOEP_ASR_DEVICE=cuda unconditionally. voice-ingest-forever.sh now exports it
# only when the CUDA policy passes, so install.sh retires gpu.conf (backed up first).
