# Per-machine resource budgets used by gs_run.sh and fleet_status.sh.
# A job may use the machine minus the reserve; the reserve is what stays free for the desktop,
# ssh, the OS and anything else already running. Keys:
#   match            hostname regex (case-insensitive) used to pick this section
#   reserve_mem_gb   RAM that must stay available; gs_run refuses to start below it
#   reserve_cores    CPU cores that stay free (CPUQuota = (cores - reserve) * 100%)
#   gpu_jobs         most processes allowed on the GPU at once (always 1: one GPU job per machine)
#   gpu_mem_gb       video memory (empty on the Spark: unified memory)
#   nice             CPU niceness for batch jobs
#   io_weight        systemd IOWeight (1-10000, default 100); lower yields disk to others
#   tasks_max        process/thread cap per job
#   mem_high_pct     MemoryHigh as a percent of MemoryMax (reclaim pressure before the hard cap)

[spark]
match=chans-spark|spark
reserve_mem_gb=16
reserve_cores=2
gpu_jobs=1
gpu_mem_gb=
nice=10
io_weight=50
tasks_max=8192
mem_high_pct=90

[kalel]
match=kal-el|kalel
reserve_mem_gb=6
reserve_cores=2
gpu_jobs=1
gpu_mem_gb=8
nice=10
io_weight=50
tasks_max=4096
mem_high_pct=90

[mac]
match=cvanthin-mlt|macbook|mac
reserve_mem_gb=8
reserve_cores=2
gpu_jobs=1
gpu_mem_gb=
nice=10
io_weight=50
tasks_max=4096
mem_high_pct=90

[default]
match=.*
reserve_mem_gb=4
reserve_cores=1
gpu_jobs=1
gpu_mem_gb=
nice=10
io_weight=50
tasks_max=4096
mem_high_pct=90
