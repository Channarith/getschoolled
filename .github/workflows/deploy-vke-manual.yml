# Manual VKE deploy for identity + memory + web (QA login / survey / UI fixes).
# No skip conditions — always runs when you click "Run workflow".
name: Deploy VKE (identity + web)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: commit SHA)"
        required: false
        default: ""
      include_memory:
        description: "Also build and roll memory (flags, mascots, survey template)"
        type: boolean
        required: false
        default: true
      include_web:
        description: "Also build and roll web (uncheck for backend-only deploy)"
        type: boolean
        required: false
        default: true

# Shares the Deploy workflow's concurrency group so a manual deploy and a
# push-to-main / dispatch Deploy never run against the aoep namespace at the same
# time. Concurrent runs previously clobbered each other's image pins (one set a
# git-SHA tag, the other the resolved sha256 digest) and BOTH smoke gates failed,
# auto-rolling-back a healthy deploy.
concurrency:
  group: vke-deploy-aoep
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.REGISTRY || 'sjc.vultrcr.com/salareen' }}

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      services: ${{ steps.mk.outputs.services }}
    steps:
      - id: mk
        run: |
          MATRIX='[{"name":"identity","dockerfile":"services/identity/Dockerfile","context":"."}'
          SVCS="identity"
          if [ "${{ inputs.include_memory }}" = "true" ]; then
            MATRIX="${MATRIX},{\"name\":\"memory\",\"dockerfile\":\"services/memory/Dockerfile\",\"context\":\".\"}"
            SVCS="${SVCS} memory"
          fi
          if [ "${{ inputs.include_web }}" = "true" ]; then
            MATRIX="${MATRIX},{\"name\":\"web\",\"dockerfile\":\"apps/web/Dockerfile\",\"context\":\".\"}"
            SVCS="${SVCS} web"
          fi
          MATRIX="${MATRIX}]"
          echo "matrix={\"include\":${MATRIX}}" >> "$GITHUB_OUTPUT"
          echo "services=${SVCS}" >> "$GITHUB_OUTPUT"

  build-push:
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Vultr Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.VULTR_REGISTRY_USERNAME }}
          password: ${{ secrets.VULTR_REGISTRY_PASSWORD }}
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Build + push ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # A git-SHA tag stays for browsing the registry, but the roll below pins
          # the immutable sha256 digest emitted here (same invariant as deploy.yml)
          # so production runs the exact artifact and the digest smoke can verify it.
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.name }}:${{ steps.tag.outputs.tag }}
      - name: Record image digest
        run: |
          set -euo pipefail
          mkdir -p digests
          digest='${{ steps.build.outputs.digest }}'
          if [ -z "$digest" ]; then
            echo "::error::build-push-action produced no digest for ${{ matrix.name }}" >&2
            exit 1
          fi
          echo "$digest" > "digests/${{ matrix.name }}.digest"
          echo "${{ matrix.name }} -> $digest"
      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}
          path: digests/${{ matrix.name }}.digest
          retention-days: 7
          if-no-files-found: error

  roll:
    needs: [setup-matrix, build-push]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - name: Configure kubeconfig
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          VKE_CLUSTER_ID: ${{ vars.VKE_CLUSTER_ID || 'bb09a491-8a40-4262-9a65-03ee5113c5a8' }}
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: bash scripts/github_configure_kubeconfig.sh
      - name: Roll deployments to the built digest
        env:
          SVCS: ${{ needs.setup-matrix.outputs.services }}
        run: |
          set -euo pipefail
          # Deploy the IMMUTABLE sha256 digest built above, not a mutable tag. This
          # matches deploy.yml's "promote the exact artifact" invariant, so the two
          # workflows pin images the same way and the digest smoke below verifies
          # the exact bytes that were built (docs/vv-master-plan.txt §4).
          for svc in $SVCS; do
            digest_file="digests/${svc}.digest"
            if [ ! -f "$digest_file" ]; then
              echo "::error::no digest artifact for $svc — refusing to deploy a stale/mutable tag" >&2
              exit 1
            fi
            digest="$(tr -d '[:space:]' < "$digest_file")"
            kubectl -n aoep set image "deployment/$svc" "$svc=${REGISTRY}/${svc}@${digest}"
            kubectl -n aoep rollout status "deployment/$svc" --timeout=600s
          done
          echo "Deployed: $SVCS at ${REGISTRY}/*@<digest>"

      - name: Digest-match smoke
        env:
          DIGEST_DIR: digests
          NS: aoep
          # Only check the services actually deployed in this run, not all 9
          SERVICES: ${{ needs.setup-matrix.outputs.services }}
        run: bash scripts/post_deploy_smoke.sh

      - name: Auto-rollback on smoke failure
        if: failure()
        env:
          SVCS: ${{ needs.setup-matrix.outputs.services }}
        run: |
          echo "Digest-match smoke failed — rolling back deployed services"
          for svc in $SVCS; do
            kubectl -n aoep rollout undo "deployment/$svc" || echo "rollback $svc skipped"
          done
