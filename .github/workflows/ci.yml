name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  version-bump:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require VERSION bump + changelog version on every PR
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: bash scripts/check_pr_version_bump.sh

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python packages (editable)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e "packages/shared[test,harvest]"
          python3 -m pip install -e "packages/sdk[test]"
          python3 -m pip install -e "packages/webcam-vision[test]"
          for pkg in services/orchestrator services/speech \
            services/perception services/memory services/curriculum \
            services/billing apps/agent-runtime; do
            python3 -m pip install -e "$pkg[test]"
          done
          # The webcam labs analyse frames, so they need the vision stack.
          python3 -m pip install \
            "opencv-contrib-python-headless==4.10.0.84" "numpy==1.26.4"
      - name: Run tests
        run: python3 -m pytest packages/shared/tests packages/sdk/tests packages/vision-lab/tests packages/webcam-vision/tests services/*/tests apps/agent-runtime/tests apps/webcam-lab/tests training/tests scripts/tests qa/tests subrepos/theodore_webcam_lab/tests labs/*/tests -q

  webcam-lab:
    # labs/theodore-webcam is a self-contained private sub-repo: it is not in
    # the monorepo pytest glob above, so it gets its own build + test job.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/theodore-webcam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the lab (editable)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[test]"
      - name: Run lab tests
        run: python3 -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create local.env from example for compose validation
        run: cp config/local.env.example config/local.env
      - name: Validate docker compose
        run: docker compose -f infra/compose/docker-compose.yml config >/dev/null

  k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render kustomize manifests (base + prod + staging overlays)
        run: |
          set -euo pipefail
          # Every kustomize root must render, so overlay drift (a bad patch, a
          # renamed resource) fails the PR instead of the deploy.
          for root in infra/k8s infra/k8s-vke infra/k8s-staging; do
            echo "::group::kustomize $root"
            kubectl kustomize "$root" >/dev/null
            echo "OK: $root"
            echo "::endgroup::"
          done

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.8.0 --activate
      - name: Install mobile deps
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck mobile app
        run: bash scripts/mobile-typecheck.sh
      - name: Mobile Jest unit tests
        # ~2 s. Guards mobile regressions: Kids section API, notification
        # default hour, mic session logic, driving detection, LK audio routing.
        # Previously ran in mobile-tests.yml (advisory) — now a required gate.
        run: npx jest --no-coverage --ci

  regression-canary:
    # Source-level checks that verify critical patterns exist in the codebase
    # without needing the full Docker stack (~20 s). These catch the class of
    # regression found in v0.45.x: silent behavior changes that pass typecheck
    # but break a feature (wrong default, swallowed error, missing guard).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Install Playwright (chromium only, no stack needed)
        run: npx playwright install --with-deps chromium
      - name: Regression canary — source-level checks
        # Uses playwright.canary.config.ts which has NO globalSetup, so there
        # is no stack health check and no auth sign-in. Tests in e2e/canary/
        # are pure execSync source reads — no browser navigation, no server.
        run: npx playwright test --config playwright.canary.config.ts

  gate-meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No --admin in pr merge
        run: |
          # Exclude ci.yml itself (it contains these patterns as grep strings)
          if grep -rn "gh pr merge.*--admin\|--admin.*gh pr merge" .github/workflows/*.yml \
              --exclude=ci.yml; then
            echo "FAIL: --admin found in pr merge command" >&2
            exit 1
          fi
          echo "OK: no --admin in pr merge"
      - name: No silent rollout failures
        run: |
          # Exclude ci.yml itself (it contains these patterns as grep strings)
          if grep -rn "rollout status.*|| true\||| true" .github/workflows/*.yml \
              --exclude=ci.yml | grep "rollout status"; then
            echo "FAIL: silent rollout failure (|| true) found" >&2
            exit 1
          fi
          echo "OK: no silent rollout failures"
      - name: No :latest push in deploy workflows
        run: |
          if grep -n "REGISTRY.*:latest\|:latest" .github/workflows/deploy.yml .github/workflows/deploy-vke-manual.yml 2>/dev/null | grep -v "^#" | grep -v "gate-meta\|synthetic\|post_deploy"; then
            echo "FAIL: :latest tag found in deploy workflow" >&2
            exit 1
          fi
          echo "OK: no :latest in deploy workflows"
