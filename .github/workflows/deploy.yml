# Build + push the service/web container images to the Vultr Container Registry
# and roll the VKE deployments. THIS is what makes a merge to main actually reach
# the running cluster - the other workflows only run tests / bump the version and
# never rebuild or redeploy the images, so until now the cluster kept running
# whatever images were pushed by hand.
#
# Triggers:
#   * workflow_dispatch  - click "Run workflow" to deploy on demand (recommended
#                          for the demo).
#   * push to main       - auto-deploys ONLY when the repo variable
#                          AUTO_DEPLOY == "true" (Settings > Variables), so it
#                          never fails for forks / before secrets are set.
#
# Required repo secrets:
#   VULTR_REGISTRY_USERNAME / VULTR_REGISTRY_PASSWORD  (Vultr Container Registry creds)
#   KUBE_CONFIG_B64                                     (base64 of a kubeconfig for the VKE cluster)
#   KUBE_CONFIG                                         (optional: raw kubeconfig YAML multiline secret)
# Optional repo variables:
#   REGISTRY  (default sjc.vultrcr.com/salareen)
#   AUTO_DEPLOY ("true" to deploy on every push to main)
name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to build/deploy (default: commit SHA)"
        required: false
        default: ""
  push:
    branches: [main]

# Serialize ALL production deploys to the aoep namespace across workflows. The
# manual "Deploy VKE (identity + web)" workflow shares this exact group, so the
# two can never run at the same time and clobber each other's image pins (which
# once left identity/memory/web half tag-pinned, half digest-pinned and failed
# both smoke gates). Do NOT key this on github.ref — a push-to-main deploy and a
# manual dispatch must still serialize.
concurrency:
  group: vke-deploy-aoep
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.REGISTRY || 'sjc.vultrcr.com/salareen' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Manual Deploy run — will build and roll all services."
          elif [ "${{ vars.AUTO_DEPLOY }}" = "true" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Push to main with AUTO_DEPLOY=true — will deploy."
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped: this was a push to main without AUTO_DEPLOY=true."
            echo "::notice::Use Actions → Deploy → Run workflow (manual), or"
            echo "::notice::Actions → Deploy VKE (identity + web) → Run workflow (faster QA fix)."
          fi

  build-push:
    needs: gate
    if: needs.gate.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: orchestrator, dockerfile: services/orchestrator/Dockerfile, context: . }
          - { name: speech,       dockerfile: services/speech/Dockerfile,       context: . }
          - { name: perception,   dockerfile: services/perception/Dockerfile,   context: . }
          - { name: memory,       dockerfile: services/memory/Dockerfile,       context: . }
          - { name: curriculum,   dockerfile: services/curriculum/Dockerfile,   context: . }
          - { name: billing,      dockerfile: services/billing/Dockerfile,      context: . }
          - { name: identity,     dockerfile: services/identity/Dockerfile,     context: . }
          - { name: integrations, dockerfile: services/integrations/Dockerfile, context: . }
          - { name: harvester,    dockerfile: services/harvester/Dockerfile,    context: . }
          - { name: web,          dockerfile: apps/web/Dockerfile,              context: . }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Vultr Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.VULTR_REGISTRY_USERNAME }}
          password: ${{ secrets.VULTR_REGISTRY_PASSWORD }}
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Build + push ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # Still push a human-readable git-SHA tag for browsing the registry,
          # but the DEPLOY (below) pins the immutable sha256 digest emitted here,
          # so production runs the exact artifact that was built — never a rebuild
          # or a tag that could be overwritten. See docs/vv-master-plan.txt §4.
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.name }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record image digest
        run: |
          set -euo pipefail
          mkdir -p digests
          digest='${{ steps.build.outputs.digest }}'
          if [ -z "$digest" ]; then
            echo "::error::build-push-action produced no digest for ${{ matrix.name }}" >&2
            exit 1
          fi
          echo "$digest" > "digests/${{ matrix.name }}.digest"
          echo "${{ matrix.name }} -> $digest"
      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}
          path: digests/${{ matrix.name }}.digest
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: [gate, build-push]
    if: needs.gate.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - name: Configure kubeconfig
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          VKE_CLUSTER_ID: ${{ vars.VKE_CLUSTER_ID || 'bb09a491-8a40-4262-9a65-03ee5113c5a8' }}
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: bash scripts/github_configure_kubeconfig.sh
      - name: Roll deployments to the built digest
        run: |
          set -euo pipefail
          # Deploy the IMMUTABLE sha256 digest built above, not a tag. This is the
          # "promote the exact artifact" invariant (docs/vv-master-plan.txt §4).
          for svc in orchestrator speech perception memory curriculum billing identity integrations harvester web; do
            echo "::group::$svc"
            digest_file="digests/${svc}.digest"
            if [ ! -f "$digest_file" ]; then
              echo "::error::no digest artifact for $svc — refusing to deploy a stale/mutable tag" >&2
              exit 1
            fi
            digest="$(tr -d '[:space:]' < "$digest_file")"
            # Container names match the deployment name in infra/k8s.
            kubectl -n aoep set image "deployment/$svc" "$svc=${REGISTRY}/${svc}@${digest}" || \
              echo "deployment/$svc not found (skipping)"
            echo "::endgroup::"
          done
          for svc in orchestrator speech perception memory curriculum billing identity integrations web; do
            kubectl -n aoep rollout status "deployment/$svc" --timeout=240s
          done

      - name: Digest-match smoke
        env:
          DIGEST_DIR: digests
          NS: aoep
        run: bash scripts/post_deploy_smoke.sh

      - name: Auto-rollback on smoke failure
        if: failure()
        run: |
          echo "Digest-match smoke failed — rolling back all services"
          for svc in orchestrator speech perception memory curriculum billing identity integrations harvester web; do
            kubectl -n aoep rollout undo "deployment/$svc" || echo "rollback $svc skipped"
          done
