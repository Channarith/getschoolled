# Read-only pod status for the demo labs. Does not change images or replicas.
name: Cluster status

on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          VKE_CLUSTER_ID: ${{ vars.VKE_CLUSTER_ID || 'bb09a491-8a40-4262-9a65-03ee5113c5a8' }}
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: bash scripts/github_configure_kubeconfig.sh
      - name: Demo lab pods
        run: |
          set -u
          kubectl -n aoep get pods -l 'tier=demo' -o wide
          echo "---- endpoints ----"
          kubectl -n aoep get endpoints course-studio children-lab
          echo "---- course-studio ----"
          kubectl -n aoep describe pods -l app=course-studio | sed -n '/Conditions:/,/Events:/p'
          kubectl -n aoep logs -l app=course-studio --tail=120 --all-containers=true || true
          echo "---- children-lab ----"
          kubectl -n aoep describe pods -l app=children-lab | sed -n '/Conditions:/,/Events:/p'
          kubectl -n aoep logs -l app=children-lab --tail=120 --all-containers=true || true
