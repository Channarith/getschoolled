# Reusable deploy gate: digest-match smoke + auto-rollback.
# Prefer calling this (digest mode) over inlining TAG-based smoke checks.
name: Deploy Gate

on:
  workflow_call:
    inputs:
      namespace:
        description: "Kubernetes namespace"
        required: false
        type: string
        default: "aoep"
      services:
        description: "Space-separated list of services to verify and roll back on failure"
        required: false
        type: string
        default: "orchestrator speech perception memory curriculum billing identity integrations harvester web"
    secrets:
      KUBE_CONFIG_B64:
        required: false
      KUBE_CONFIG:
        required: false
      VULTR_API_KEY:
        required: false

jobs:
  digest-match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - name: Configure kubeconfig
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          VKE_CLUSTER_ID: ${{ vars.VKE_CLUSTER_ID || 'bb09a491-8a40-4262-9a65-03ee5113c5a8' }}
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: bash scripts/github_configure_kubeconfig.sh
      - name: Digest-match smoke
        env:
          DIGEST_DIR: digests
          NS: ${{ inputs.namespace }}
          SERVICES: ${{ inputs.services }}
        run: bash scripts/post_deploy_smoke.sh
      - name: Auto-rollback on smoke failure
        if: failure()
        env:
          NS: ${{ inputs.namespace }}
          SVCS: ${{ inputs.services }}
        run: |
          echo "Digest-match smoke failed — rolling back: $SVCS"
          for svc in $SVCS; do
            kubectl -n "$NS" rollout undo "deployment/$svc" || echo "rollback $svc skipped"
          done
          exit 1
