[build-system]
requires = ["setuptools>=69.5.1", "wheel>=0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aoep-webcam-recognition-lab"
version = "0.1.0"
description = "Private lab package for webcam presence, silhouette, and voice-agent experiments."
license = { text = "LicenseRef-AOEP-Proprietary" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest==8.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
